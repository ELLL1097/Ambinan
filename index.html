<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambinan</title>
    <style>
    /* Matikan scrollbar pada window luar iframe */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Mencegah scrollbar ganda dari body */
        background-color: transparent;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Kartu utama yang memegang scrollbar tunggal */
    .gallery-container {
        max-width: 400px;
        height: 100vh; /* Mengisi penuh tinggi iframe Lapentor */
        box-sizing: border-box;
        margin: 0 auto;
        text-align: center;
        background: #fff;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        overflow-y: auto; /* Memunculkan HANYA SATU scrollbar internal jika teks panjang */
    }

    .slide-title {
        font-size: 1.2rem;
        color: #333;
        margin-bottom: 15px;
        font-weight: bold;
    }

    .image-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .image-wrapper img {
        width: 100%;
        max-width: 356px;
        border-radius: 8px;
        object-fit: cover;
        transition: opacity 0.3s ease-in-out;
    }

    .btn-nav {
        position: absolute;
        background-color: rgba(211, 84, 0, 0.85);
        color: white;
        border: none;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s;
        z-index: 10;
    }

    .btn-nav:hover {
        background-color: rgba(160, 64, 0, 1);
    }

    .prev {
        left: 5px;
    }

    .next {
        right: 5px;
    }

    .slide-desc {
        font-size: 0.9rem;
        color: #666;
        margin-top: 15px;
        line-height: 1.5;
        text-align: justify;
    }
</style>
</head>

<body>

    <div class="gallery-container">
        <!-- Judul akan berubah otomatis -->
        <div class="slide-title" id="judul-hewan">Memuat...</div>

        <div class="image-wrapper">
            <!-- Tombol Before / Prev -->
            <button class="btn-nav prev" id="btn-prev" onclick="gantiSlide(-1)">&#10094;</button>

            <!-- Gambar utama -->
            <img id="gambar-hewan" src="" alt="Koleksi Museum">

            <!-- Tombol Next -->
            <button class="btn-nav next" id="btn-next" onclick="gantiSlide(1)">&#10095;</button>
        </div>

        <!-- Keterangan akan berubah otomatis -->
        <div class="slide-desc" id="keterangan-hewan">Memuat keterangan...</div>
    </div>

    <script>
        // 1. Tempat lu masukin Judul, Link Gambar, dan Keterangan
        // Cukup edit teks di dalam tanda kutip ini aja ya
        const koleksiData = [
            {
                judul: "Ambinan 03.5429",
                gambar: "Ambinan_01.jpg",
                keterangan: "Bentuk setengah tabung, terbuat dari kayu, dibawahnya diberi papan sebagai tempat duduk. Bagian luar sandaran diukir motif kamang, yang merupakan makhluk sakral yang pernah hidup berdampingan dengan manusia. Kamang diukur dengan posisi duduk, mata melotot, melambangkan kekuatan gaib yang dapat mengusir roh jahat yang akan menggangu si anak dalam gendongan. Digunakan oleh masyarakat Dayak Kanayatn di Kalimantan Barat. Ukuran : T = 41 cm L = 40 cm"
            },
            {
                judul: "Ambinan 03.6766",
                gambar: "Ambinan_02.jpg",
                keterangan: "Terbuat dari kayu dibentuk melengkung dan diberi papan dibawhnya sebagai tempat duduk. Dinding bagian luar diberi ornament dari bahan kerang dan manik-manik dengan motif abstraksi manusia yang digayakan yang lambang roh nenek moyang dengan harapan mendapat perlindungan dari penyakit dan gangguan roh jahat. Digunakan oleh masyarakat suku Dayak Taman, Kapuas Hulu. Ukuran : T = 29,5 cm L = 41 cm."
            },
            {
                judul: "Ambinan 03.5431",
                gambar: "Ambinan_03.jpg",
                keterangan: "Bentuk setengah lingkaran, terbuat dari anyaman rotan yang dilapisi dengan kain sebagai sandaran, dibawahnya diberi papan sebagai alat duduk. Bagian luar sandaran dihiasi manik-manik kerang dirangkai dengan bentuk manusia dengan mata melotot melambangkan kekuatan luar biasa yang dapat mengusir roh jahat yang akan mengganggu si anak dalam gendongan. Digunakan oleh masyarakat Dayak Kayan, Kabupaten Sintang. Ukuran : T = 32 cm L = 41 cm"
            },
            {
                judul: "Ambinan 03.5263",
                gambar: "Ambinan_04.jpg",
                keterangan: "Terbuat dari kayu dibentuk melengkung dan diberi papan dibawahnya sebagai alat duduk. Badan dihiasi ukiran motif topeng, kerang dan rangkaian manik-manik dan digantungi masing-masing dua bauah patung kecil. Ambinan ini dgunakan untuk mengambin anak dengan posisi duduk menghadap ke punggung ibunya. Sedangkan motif yang terdapat pada ambinan dianggap akan memberikan kekuatan gaib, sehingga anak tersebut terhindar dari pengaruh roh-roh jahat. Digunakan oleh masyarakat Dayak di Kalimantan Timur. Ukuran : T = 41 cm L = 48 cm"
            }
        ];

        let indexSekarang = 0;

        // Ambil elemen HTML yang akan dimanipulasi
        const elemenJudul = document.getElementById('judul-hewan');
        const elemenGambar = document.getElementById('gambar-hewan');
        const elemenKeterangan = document.getElementById('keterangan-hewan');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function updateTampilan() {
            // Ganti konten sesuai data array
            elemenJudul.innerText = koleksiData[indexSekarang].judul;
            elemenGambar.src = koleksiData[indexSekarang].gambar;
            elemenKeterangan.innerText = koleksiData[indexSekarang].keterangan;

            // Logika sesuai revisi dosen:
            // Sembunyikan tombol Prev jika sedang di gambar urutan pertama (index 0)
            if (indexSekarang === 0) {
                btnPrev.style.display = 'none';
            } else {
                btnPrev.style.display = 'flex';
            }

            // Sembunyikan tombol Next jika sedang di gambar urutan terakhir
            if (indexSekarang === koleksiData.length - 1) {
                btnNext.style.display = 'none';
            } else {
                btnNext.style.display = 'flex';
            }
        }

        function gantiSlide(arah) {
            indexSekarang += arah;
            updateTampilan();
        }

        // Jalankan fungsi saat web pertama kali dirender
        updateTampilan();
    </script>

</body>

</html>
